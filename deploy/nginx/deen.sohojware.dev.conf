# Copy to /etc/nginx/sites-available/, symlink into sites-enabled, then: nginx -t
# Only backend/public is served. The rest of the project stays outside the web root.
# Certificate paths assume certbot. Adjust the PHP socket to the installed version.

server {
    listen 80;
    listen [::]:80;
    server_name deen.sohojware.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deen.sohojware.dev;

    root /var/www/deenmate-ai/backend/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/deen.sohojware.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deen.sohojware.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # AI answers can take a while. Keep in step with AI_REQUEST_TIMEOUT.
        fastcgi_read_timeout 150s;
    }

    # Dotfiles such as .env, apart from certificate challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
