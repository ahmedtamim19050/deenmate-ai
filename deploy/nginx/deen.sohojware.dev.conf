# Copy to /etc/nginx/sites-available/, symlink into sites-enabled, then: nginx -t
# Only backend/public is served. The rest of the project stays outside the web root.
# Certificate paths assume certbot. Confirm the PHP-FPM socket and Nginx version
# on the VPS before enabling this virtual host.

server {
    listen 80;
    listen [::]:80;
    server_name deen.sohojware.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://deen.sohojware.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deen.sohojware.dev;

    root /var/www/deenmate-ai/backend/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/deen.sohojware.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deen.sohojware.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only the Laravel front controller may execute PHP.
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 150s;
    }

    location ~* ^/(?:\.git|app|bootstrap|config|database|resources|routes|tests|vendor|node_modules)(?:/|$) {
        deny all;
    }

    location ~* ^/storage/(?:app/private|framework|logs)(?:/|$) {
        deny all;
    }

    location ~* (?:^|/)(?:\.env(?:\..*)?|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml|artisan)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.php(?:/|$) {
        deny all;
    }
}
