# Copy to /etc/supervisor/conf.d/, then: supervisorctl reread && supervisorctl update
[program:deenmate-worker]
command=php /var/www/deenmate-ai/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/deenmate-ai/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/deenmate-ai/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=120
